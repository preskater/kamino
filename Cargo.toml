[workspace]
resolver = "3"
members = [
    "crates/config",
    "crates/db",
    "crates/error",
    "crates/http",
    "crates/query",
    "crates/telemetry",
    "crates/agents",
    "crates/projects",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Kamino agent and project REST APIs"

[workspace.dependencies]
# Internal crates
kamino-config = { path = "crates/config" }
kamino-db = { path = "crates/db" }
kamino-error = { path = "crates/error" }
kamino-http = { path = "crates/http" }
kamino-query = { path = "crates/query" }
kamino-telemetry = { path = "crates/telemetry" }

# HTTP
axum = "0.8"
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "request-id", "timeout"] }
utoipa = { version = "6", features = ["axum_extras", "chrono", "decimal", "uuid"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

# Database
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
    "rust_decimal",
] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }

# Errors and logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config and validation
dotenvy = "0.15"
validator = { version = "0.21", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
