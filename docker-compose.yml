name: kamino

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kamino
      POSTGRES_PASSWORD: kamino
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - kamino-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kamino -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  agents:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BINARY: agents
    environment:
      AGENTS_BIND_ADDR: 0.0.0.0:8081
      AGENTS_DATABASE_URL: postgres://kamino:kamino@postgres:5432/kamino_agents
      PORT: 8081
      RUST_LOG: info,kamino=debug,tower_http=debug
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  projects:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BINARY: projects
    environment:
      PROJECTS_BIND_ADDR: 0.0.0.0:8082
      PROJECTS_DATABASE_URL: postgres://kamino:kamino@postgres:5432/kamino_projects
      PORT: 8082
      RUST_LOG: info,kamino=debug,tower_http=debug
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kamino-pgdata:
